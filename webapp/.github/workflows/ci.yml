name: Integration Tests and Packer Validation

on:
  pull_request:
    branches:
      - main

jobs:
  test:
    name: Integration Tests
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ${{ secrets.DB_PASSWORD }}
          MYSQL_DATABASE: ${{ secrets.DB_NAME }}
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: ${{ secrets.AWS_REGION }}
      S3_BUCKET_NAME: ${{ secrets.S3_BUCKET_NAME }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config default-libmysqlclient-dev build-essential

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Wait for MySQL
        run: |
          for i in {1..30}; do
            if mysqladmin ping -h"127.0.0.1" -P"3306" -u"${{ secrets.DB_USER }}" -p"${{ secrets.DB_PASSWORD }}" --silent; then
              echo "MySQL is ready!"
              break
            fi
            echo "Waiting for MySQL... ($i/30)"
            sleep 2
          done

      - name: Set up database configuration
        run: |
          cat > webapp/settings_ci.py << EOF
          from .settings import *

          DATABASES = {
              'default': {
                  'ENGINE': 'django.db.backends.mysql',
                  'NAME': '${{ secrets.DB_NAME }}',
                  'USER': '${{ secrets.DB_USER }}',
                  'PASSWORD': '${{ secrets.DB_PASSWORD }}',
                  'HOST': '127.0.0.1',
                  'PORT': '3306',
                  'OPTIONS': {
                      'init_command': "SET sql_mode='STRICT_TRANS_TABLES'",
                  },
              }
          }

          # Disable debug in CI
          DEBUG = False
          ALLOWED_HOSTS = ['localhost', '127.0.0.1']
          EOF

      - name: Run migrations
        env:
          DJANGO_SETTINGS_MODULE: webapp.settings_ci
        run: |
          python manage.py migrate --noinput

      - name: Start Django server
        env:
          DJANGO_SETTINGS_MODULE: webapp.settings_ci
        run: |
          python manage.py runserver 127.0.0.1:8000 &
          echo $! > server.pid

          # Wait for server to be ready
          for i in {1..30}; do
            if curl -s http://127.0.0.1:8000/healthz > /dev/null 2>&1; then
              echo "Django server is ready!"
              break
            fi
            echo "Waiting for Django server... ($i/30)"
            sleep 2
          done

      - name: Run integration tests
        env:
          DJANGO_SETTINGS_MODULE: webapp.settings_ci
          TEST_MODE: "true"
        run: |
          pytest "api/tests/integration tests/" -v --tb=short --maxfail=5

      - name: Run integration tests with coverage
        if: success()
        env:
          DJANGO_SETTINGS_MODULE: webapp.settings_ci
          TEST_MODE: "true"
        run: |
          pytest "api/tests/integration tests/" --cov=api --cov-report=xml --cov-report=html --cov-report=term-missing

      - name: Generate HTML test report
        if: always()
        run: |
          pip install pytest-html
          pytest "api/tests/integration tests/" --html=report.html --self-contained-html || true

      - name: Upload coverage reports
        if: success()
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          flags: integration
          name: integration-tests
        continue-on-error: true

      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            coverage.xml
            htmlcov/
            report.html
          retention-days: 30

      - name: Stop Django server
        if: always()
        run: |
          if [ -f server.pid ]; then
            kill $(cat server.pid) || true
          fi

      - name: Display logs on failure
        if: failure()
        run: |
          echo "=== Recent logs ==="
          tail -n 100 nohup.out || echo "No logs available"
          exit 1

  packer-validate:
    name: Packer Format and Validate
    runs-on: ubuntu-latest
#    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Packer
        uses: hashicorp/setup-packer@v2

      - name: Initialize Packer
        run: |
          cd packer
          packer init ubuntu-webapp.pkr.hcl

      - name: Check Packer Template Format
        run: |
          cd packer
          packer fmt -check -diff ubuntu-webapp.pkr.hcl

      - name: Validate Packer Template
        run: |
          cd packer
          packer validate -syntax-only \
                -var "demo_account_id=${{ secrets.DEMO_ACCOUNT_ID }}" \
                -var "aws_region=${{ secrets.AWS_REGION }}" \
                ubuntu-webapp.pkr.hcl