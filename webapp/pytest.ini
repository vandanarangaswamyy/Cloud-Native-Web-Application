[pytest]
# Django settings
DJANGO_SETTINGS_MODULE = webapp.settings_test

# Test file patterns
python_files = test_*.py *_test.py *_tests.py
python_classes = Test*
python_functions = test_*

# Test discovery paths
testpaths =
    api/tests

# Markers
markers =
    e2e: marks tests as end-to-end tests (deselect with '-m "not e2e"')
    django_db: marks tests as requiring database access
    integration: marks tests as integration tests
    unit: marks tests as unit tests

# Output options
addopts =
    -v
    --tb=short
    --strict-markers
    --disable-warnings

# Ignore patterns
norecursedirs =
    .git
    .tox
    dist
    build
    *.egg
    venv
    __pycache__
    .pytest_cache

# Don't search in these paths
python_ignore =
    api/migrations
    venv